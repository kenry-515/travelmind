# TravelMind Agent — 一键编排
# backend (FastAPI) + frontend (nginx) + redis (会话) + postgres（可选，--profile db 启用）
#
# 前置：cp backend/.env.example backend/.env 并填入真实 Keys（见 docs/DEPLOY.md）

services:
  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      # compose 内强制 Redis 会话存储（覆盖 .env 中的 memory 默认值）
      SESSION_STORE: redis
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/travelmind_db
      DATABASE_URL_SYNC: postgresql://postgres:postgres@postgres:5432/travelmind_db
    volumes:
      - chroma-data:/app/chroma_data       # 向量库持久化（空库时 entrypoint 自举）
      - ./backend/data:/app/data:ro        # 知识库数据（只读挂载）
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
        required: false                   # optional: --profile db 才启用
    ports:
      - "8000:8000"
    restart: unless-stopped
    # Phase 12.29e: healthcheck + 资源限制
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_started
    ports:
      - "5173:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:16-alpine
    profiles: ["db"]                        # 可选：docker compose --profile db up
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-travelmind_db}
    volumes:
      - pg-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  chroma-data:
  redis-data:
  pg-data:
