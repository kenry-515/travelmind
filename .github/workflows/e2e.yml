name: E2E Tests

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'frontend/e2e/**'
      - 'frontend/playwright.config.ts'
      - '.github/workflows/e2e.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'frontend/e2e/**'
      - 'frontend/playwright.config.ts'
      - '.github/workflows/e2e.yml'

# 串行依赖 backend 跑完才跑 E2E（需要 backend 在 8000）
jobs:
  e2e:
    name: Playwright E2E (Real Backend)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: travelmind_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/travelmind_db
      DATABASE_URL_SYNC: postgresql://postgres:postgres@postgres:5432/travelmind_db
      SESSION_STORE: memory
      APP_ENV: development

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install backend deps
        working-directory: backend
        run: |
          uv venv --python 3.11 .venv
          uv pip install -r requirements.txt -r requirements-prod.txt

      - name: Start backend
        working-directory: backend
        run: |
          # Phase 18 E2E fix: redirect uvicorn to /tmp/uvicorn.log(失败时可看 log)
          # + 用 curl --fail 检测 2xx(避免 grep shell 转义问题) + 加长 180s timeout
          .venv/bin/python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/uvicorn.log 2>&1 &
          BACKEND_PID=$!
          echo "BACKEND_PID=$BACKEND_PID"
          for i in {1..90}; do
            sleep 2
            if curl --fail -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/api/v1/health 2>/dev/null | grep -q '^2'; then
              echo "✅ Backend healthy (after ${i} attempts)"
              exit 0
            fi
            # 每 30s 打印 uvicorn log tail 帮助 debug
            if [ $((i % 15)) -eq 0 ]; then
              echo "--- uvicorn log tail (attempt $i) ---"
              tail -5 /tmp/uvicorn.log 2>/dev/null || true
            fi
          done
          echo "❌ Backend failed to start in 180s"
          echo "--- uvicorn full log ---"
          cat /tmp/uvicorn.log 2>/dev/null || true
          kill $BACKEND_PID 2>/dev/null || true
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        working-directory: frontend
        env:
          CI: true
        run: npx playwright test --project=chromium

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/test-results/
          retention-days: 7

      - name: Cleanup backend
        if: always()
        run: pkill -f uvicorn || true