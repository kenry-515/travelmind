name: CI

on:
  push:
    paths-ignore:
      - 'docs/**'
      - 'memory/**'
      - 'skills/**'
      - 'research/**'
      - 'data/**'
      - '*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'memory/**'
      - 'skills/**'
      - 'research/**'
      - 'data/**'
      - '*.md'

jobs:
  backend:
    name: Backend (pytest + security)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run unit tests (no external calls)
        working-directory: backend
        run: python -m pytest -q

      - name: Upload coverage on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: backend/.coverage
          retention-days: 7

      - name: Security scan (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt --desc on 2>&1 || echo "⚠️ pip-audit found issues (non-blocking)"

  frontend:
    name: Frontend (typecheck + lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc -b

      - name: Lint
        run: npm run lint

  docker:
    name: Docker Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -t travelmind-backend:test ./backend

      - name: Build frontend Docker image
        run: docker build -t travelmind-frontend:test ./frontend
